<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Work Track — sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #fff;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 400px;
        padding: 32px;
        text-align: center;
      }
      img {
        width: 80px;
        height: 80px;
      }
      p {
        color: #cbd5e1;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: #2dd4bf;
        color: #0f172a;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand.svg" alt="" />
      <h1>Você está sem conexão</h1>
      <p>
        Conecte-se à internet para acessar seus projetos, tempo e contexto. O
        Work Track não salva registros de trabalho no cache offline do
        aplicativo.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
