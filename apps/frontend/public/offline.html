<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d5963" />
    <title>Work Track — sem conexão</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f4f8f8;
        --foreground: #16383d;
        --muted-foreground: #526c71;
        --primary: #0d5963;
        --primary-foreground: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #0e1c20;
          --foreground: #edf5f5;
          --muted-foreground: #a5bfc3;
          --primary: #8bcdd2;
          --primary-foreground: #10383f;
        }
      }
      a:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 4px;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 400px;
        padding: 32px;
        text-align: center;
      }
      img {
        width: 80px;
        height: 80px;
      }
      p {
        color: var(--muted-foreground);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: var(--primary);
        color: var(--primary-foreground);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand.svg" alt="" />
      <h1>Você está sem conexão</h1>
      <p>
        Conecte-se à internet para acessar seus projetos, tempo e contexto. O
        Work Track não salva registros de trabalho no cache offline do
        aplicativo.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
