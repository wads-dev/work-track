services:
  frontend:
    image: node:22
    working_dir: /workspace
    init: true
    command: >-
      sh -c "npm ci --ignore-scripts --no-audit --no-fund &&
      npm run dev --workspace @work-track/frontend --
      --config /workspace/docker/firebase/vite.config.mjs"
    environment:
      npm_config_cache: /cache/npm
      WORK_TRACK_AUTH_PORT: '${FIREBASE_AUTH_PORT:-9099}'
      WORK_TRACK_FIRESTORE_PORT: '${FIREBASE_FIRESTORE_PORT:-8081}'
      WORK_TRACK_FUNCTIONS_PORT: '${FIREBASE_FUNCTIONS_PORT:-5001}'
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173' # Vite frontend + HMR
    volumes:
      - .:/workspace
      - vite_root_dependencies:/workspace/node_modules
      - vite_backend_dependencies:/workspace/apps/backend/node_modules
      - vite_frontend_dependencies:/workspace/apps/frontend/node_modules
      - vite_npm_cache:/cache/npm

  firebase:
    build:
      context: ./docker/firebase
    init: true
    working_dir: /workspace
    environment:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      FIREBASE_EMULATORS_PATH: /cache/emulators
      npm_config_cache: /cache/npm
      XDG_CONFIG_HOME: /cache/config
      GCLOUD_PROJECT: demo-work-track
      GOOGLE_CLOUD_PROJECT: demo-work-track
    ports:
      - '127.0.0.1:${FIREBASE_AUTH_PORT:-9099}:9099' # Auth
      - '127.0.0.1:${FIREBASE_FIRESTORE_PORT:-8081}:8081' # Firestore
      - '127.0.0.1:${FIREBASE_FUNCTIONS_PORT:-5001}:5001' # Functions
      - '127.0.0.1:${FIREBASE_UI_PORT:-4001}:4000' # Emulator UI (host configurable)
    volumes:
      - ./package.json:/input/package.json:ro
      - ./package-lock.json:/input/package-lock.json:ro
      - ./apps/backend/package.json:/input/apps/backend/package.json:ro
      - ./apps/backend/tsconfig.json:/input/apps/backend/tsconfig.json:ro
      - ./apps/backend/tsconfig.build.json:/input/apps/backend/tsconfig.build.json:ro
      - ./apps/backend/src:/input/apps/backend/src:ro
      - ./apps/frontend/package.json:/input/apps/frontend/package.json:ro
      - ./firebase.emulators.json:/input/firebase.emulators.json:ro
      - ./firestore.rules:/input/firestore.rules:ro
      - ./firestore.indexes.json:/input/firestore.indexes.json:ro
      - ./docker/firebase/start-emulators.sh:/input/docker/firebase/start-emulators.sh:ro
      - ./docker/firebase/demo-data:/input/docker/firebase/demo-data:ro
      - root_dependencies:/workspace/node_modules
      - backend_dependencies:/workspace/apps/backend/node_modules
      - firebase_cache:/cache
      - emulator_data:/data
    stop_grace_period: 60s

volumes:
  root_dependencies:
  backend_dependencies:
  vite_root_dependencies:
  vite_backend_dependencies:
  vite_frontend_dependencies:
  vite_npm_cache:
  firebase_cache:
  emulator_data:
