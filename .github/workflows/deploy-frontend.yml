name: Deploy frontend
on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.nvmrc'
      - '.github/workflows/deploy-frontend.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-frontend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run build --workspace @work-track/frontend
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1048371748954/locations/global/workloadIdentityPools/github-actions/providers/work-track
          service_account: github-deploy@wadsworktrack.iam.gserviceaccount.com
      - run: npx -y firebase-tools@latest deploy --only hosting --project wadsworktrack --non-interactive
