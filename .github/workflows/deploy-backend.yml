name: Deploy backend
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'scripts/build*.mjs'
      - 'scripts/package*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'scripts/wait-firestore-indexes*.mjs'
      - 'scripts/wait-firestore-deploy*.mjs'
      - '.nvmrc'
      - '.github/workflows/deploy-backend.yml'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: deploy-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run lint && npm run typecheck --workspace @work-track/backend && npm test --workspace @work-track/core && npm test --workspace @work-track/data && npm test --workspace @work-track/backend && npm run build --workspace @work-track/backend && npm run test:tooling
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1048371748954/locations/global/workloadIdentityPools/github-actions/providers/work-track
          service_account: github-deploy@wadsworktrack.iam.gserviceaccount.com
      - name: Require complete project type migration before deployment
        run: node scripts/backfill-project-type.mjs --project wadsworktrack --verify
      - uses: google-github-actions/setup-gcloud@v3
      - name: Wait for required Firestore indexes before publishing Functions
        timeout-minutes: 22
        run: node scripts/wait-firestore-indexes.mjs wadsworktrack
      - name: Wait for same-push Firestore deployment before publishing Functions
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/wait-firestore-deploy.mjs
      - name: Retire unused Web callables
        # functions:delete fails when every target is absent; list first, never mask real errors.
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const cli = ['-y', 'firebase-tools@latest'];
          const project = 'wadsworktrack';
          const region = 'southamerica-east1';
          const codebase = 'default';
          const retired = [
            'createProject',
            'mergeProjects',
            'mergeTopics',
            'moveTopic',
            'getTopicReport',
          ];
          const listed = JSON.parse(execFileSync('npx', [
            ...cli, 'functions:list', '--project', project, '--json', '--non-interactive',
          ], { encoding: 'utf8' }));
          if (listed.status !== 'success' || !Array.isArray(listed.result)) {
            throw new Error('Unexpected Firebase functions:list response');
          }
          const endpoints = listed.result.filter((endpoint) =>
            endpoint.region === region && (endpoint.codebase || 'default') === codebase,
          );
          const existing = new Set(endpoints.map((endpoint) => endpoint.id));
          const targets = retired.filter((name) => existing.has(name));
          // CLI names also match function groups; refuse any broader prefix deletion.
          if (endpoints.some((endpoint) => targets.some((name) => endpoint.id.startsWith(name + '-')))) {
            throw new Error('Retired callable name also matches a function group; refusing broader deletion');
          }
          if (targets.length === 0) {
            console.log('Retired Web callables are already absent.');
          } else {
            execFileSync('npx', [
              ...cli, 'functions:delete', ...targets.map((name) => codebase + ':' + name),
              '--region', region, '--project', project, '--force', '--non-interactive',
            ], { stdio: 'inherit' });
          }
          NODE
      - run: npx -y firebase-tools@latest deploy --only functions:default:mcp,functions:default:listCompanyPeople,functions:default:exportProjectForDeletion,functions:default:deleteProjectPermanently --project wadsworktrack --non-interactive
